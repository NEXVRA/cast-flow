<script>

/* =====================================================
 * ROYAL SHIFT SYSTEM
 * Script.html
 *
 * シフト提出画面
 * フロントエンド全体制御
 * ===================================================== */


/* =====================================================
 * 01. 状態管理
 * ===================================================== */


/* ---------- LIFF ---------- */

const LIFF_ID =
  "2011488723-gl54Hlt3";

let liffProfile = null;
let liffIdToken = "";

let isLiffReady = false;


/* ---------- カレンダー ---------- */

let calendar = null;


/* ---------- システム設定 ---------- */

let shiftSettings = null;
let isLoadingSettings = false;


/* ---------- キャスト契約時間 ---------- */

let currentCastDefaults = null;
let isLoadingCastDefaults = false;


/* ---------- 1日入力 ---------- */

let selectedDate = "";
let selectedStatus = "working";

let isSaving = false;
let isEndTimeLast = false;


/* ---------- 月間データ ---------- */

let isLoadingMonth = false;
let currentMonthSubmitted = false;

const shiftEntries = {};


/* ---------- 一括入力 ---------- */

let bulkMode = "selectedDates";
let bulkStatus = "working";

let bulkWeekdays = [];
let multiSelectedDates = [];

let isMultiSelectMode = false;
let isBulkSaving = false;
let isBulkEndTimeLast = false;


/* ---------- UI ---------- */

let toastTimer = null;


/* =====================================================
 * 02. システム初期化
 * ===================================================== */

/**
 * DOM読み込み完了後に
 * ROYAL SHIFTを起動する。
 */
document.addEventListener(
  "DOMContentLoaded",
  () => {

    initializeSystem();

  }
);


/**
 * システム全体の起動フロー。
 *
 * 1. LIFF初期化
 * 2. LINEログイン
 * 3. SETTINGS取得
 * 4. CAST契約時間取得
 * 5. アプリ起動
 */
function initializeSystem() {

  initializeLiff();

}


/* =====================================================
 * 03. LIFF初期化
 * ===================================================== */

/**
 * LIFFを初期化し、
 * LINEログイン状態を確認する。
 */
async function initializeLiff() {

  try {

    if (
      typeof liff ===
      "undefined"
    ) {

      throw new Error(
        "LIFF SDKを読み込めませんでした"
      );

    }


    await liff.init({
      liffId:
        LIFF_ID
    });


    /*
     * 未ログインの場合
     */
    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /*
     * LINEプロフィール取得
     */
    liffProfile =
      await liff.getProfile();


    /*
     * IDトークン取得
     *
     * 後でGAS側で本人確認に使用する。
     */
    liffIdToken =
      liff.getIDToken() || "";


    isLiffReady =
      true;


    console.log(
      "LIFF接続成功",
      {
        displayName:
          liffProfile
            ? liffProfile.displayName
            : ""
      }
    );


    /*
     * 現段階では、
     * LIFF接続後に既存システムを起動。
     *
     * CAST本人認証は次の段階で追加する。
     */
    loadShiftSettings();


  } catch (error) {

    console.error(
      "LIFF初期化エラー",
      error
    );


    hideLoadingScreen();


    showNotice(
      "LINEログインに失敗しました"
    );

  }

}


/* =====================================================
 * 04. SETTINGS連携
 * ===================================================== */

/**
 * SETTINGSシートから設定を取得する。
 */
function loadShiftSettings() {

  if (isLoadingSettings) {
    return;
  }


  isLoadingSettings =
    true;


  google.script.run

    .withSuccessHandler(
      (settings) => {

        isLoadingSettings =
          false;


        try {

          shiftSettings =
            normalizeShiftSettings(
              settings
            );


          validateShiftSettings();


          startShiftApplication();


        } catch (error) {

          hideLoadingScreen();


          showNotice(
            getErrorMessage(
              error,
              "シフト設定の読み込みに失敗しました"
            )
          );

        }

      }
    )

    .withFailureHandler(
      (error) => {

        isLoadingSettings =
          false;


        hideLoadingScreen();


        showNotice(
          getErrorMessage(
            error,
            "シフト設定の読み込みに失敗しました"
          )
        );

      }
    )

    .getShiftSettings();

}


/**
 * GASから取得した設定を
 * フロント用に整形する。
 */
function normalizeShiftSettings(
  settings
) {

  if (!settings) {

    throw new Error(
      "SETTINGSのデータが取得できませんでした"
    );

  }


  return {

    startHourList:
      Array.isArray(
        settings.startHourList
      )
        ? settings.startHourList
        : [],


    endHourList:
      Array.isArray(
        settings.endHourList
      )
        ? settings.endHourList
        : [],


    minuteList:
      Array.isArray(
        settings.minuteList
      )
        ? settings.minuteList
        : [],


    enableLast:
      Boolean(
        settings.enableLast
      ),


    defaultStartHour:
      String(
        settings.defaultStartHour ??
        "20"
      ).padStart(
        2,
        "0"
      ),


    defaultStartMinute:
      String(
        settings.defaultStartMinute ??
        "00"
      ).padStart(
        2,
        "0"
      ),


    defaultEndHour:
      String(
        settings.defaultEndHour ??
        "01"
      ).padStart(
        2,
        "0"
      ),


    defaultEndMinute:
      String(
        settings.defaultEndMinute ??
        "00"
      ).padStart(
        2,
        "0"
      )

  };

}


/**
 * 必須設定をチェックする。
 */
function validateShiftSettings() {

  if (
    shiftSettings.startHourList.length ===
    0
  ) {

    throw new Error(
      "START_HOUR_MIN / START_HOUR_MAX の設定を確認してください"
    );

  }


  if (
    shiftSettings.endHourList.length ===
    0
  ) {

    throw new Error(
      "END_HOURS の設定を確認してください"
    );

  }


  if (
    shiftSettings.minuteList.length ===
    0
  ) {

    throw new Error(
      "MINUTE_STEP の設定を確認してください"
    );

  }

}


/**
 * SETTINGS取得後の起動フロー。
 */
function startShiftApplication() {

  loadCurrentCastDefaults();

}


/* =====================================================
 * 04-2. CAST契約時間連携
 * ===================================================== */

/**
 * 現在利用中のキャストの
 * デフォルト勤務時間を取得する。
 *
 * 現段階ではまだS001仮ユーザー。
 */
function loadCurrentCastDefaults() {

  if (
    isLoadingCastDefaults
  ) {
    return;
  }


  isLoadingCastDefaults =
    true;


  google.script.run

    .withSuccessHandler(
      (result) => {

        isLoadingCastDefaults =
          false;


        currentCastDefaults = {

          castId:
            result &&
            result.castId

              ? String(
                  result.castId
                )

              : "",


          castName:
            result &&
            result.castName

              ? String(
                  result.castName
                )

              : "",


          defaultStartTime:
            normalizeTimeInputValue(
              result &&
              result.defaultStartTime,
              getSettingsDefaultStartTime()
            ),


          defaultEndTime:
            normalizeTimeInputValue(
              result &&
              result.defaultEndTime,
              getSettingsDefaultEndTime()
            )

        };


        launchShiftApplication();

      }
    )

    .withFailureHandler(
      (error) => {

        isLoadingCastDefaults =
          false;


        currentCastDefaults = {

          castId:
            "",

          castName:
            "",

          defaultStartTime:
            getSettingsDefaultStartTime(),

          defaultEndTime:
            getSettingsDefaultEndTime()

        };


        console.error(
          "CAST契約時間の取得に失敗しました",
          error
        );


        launchShiftApplication();

      }
    )

    .getCurrentCastDefaultTimes();

}


/**
 * SETTINGS・CAST取得完了後に
 * アプリ本体を起動する。
 */
function launchShiftApplication() {

  initializeManualTimeInputs();

  initializeCalendar();


  window.setTimeout(
    () => {

      hideLoadingScreen();

    },
    650
  );

}


/**
 * ローディング画面を閉じる。
 */
function hideLoadingScreen() {

  const loadingScreen =
    document.getElementById(
      "loadingScreen"
    );


  if (!loadingScreen) {
    return;
  }


  loadingScreen.classList.add(
    "hide"
  );

}

/* =====================================================
 * 05. カレンダー初期化
 * ===================================================== */

function initializeCalendar() {

  const calendarElement =
    document.getElementById(
      "calendar"
    );


  if (!calendarElement) {

    showNotice(
      "カレンダーの表示に失敗しました"
    );

    return;

  }


  const nextMonth =
    new Date();


  nextMonth.setMonth(
    nextMonth.getMonth() + 1
  );


  nextMonth.setDate(1);


  calendar =
    new FullCalendar.Calendar(
      calendarElement,
      {

        initialView:
          "dayGridMonth",

        initialDate:
          nextMonth,

        locale:
          "ja",

        firstDay:
          0,

        fixedWeekCount:
          false,

        showNonCurrentDates:
          true,

        height:
          "auto",


        headerToolbar: {

          left:
            "prev",

          center:
            "title",

          right:
            "next"

        },


        titleFormat: {

          year:
            "numeric",

          month:
            "long"

        },


        dayHeaderFormat: {

          weekday:
            "short"

        },


        dateClick:
          (info) => {

            handleCalendarDateClick(
              info
            );

          },


        eventClick:
          (info) => {

            handleCalendarEventClick(
              info
            );

          },


        datesSet:
          () => {

            handleCalendarMonthChange();

          },


        dayCellDidMount:
          (info) => {

            applyMultiSelectClass(
              info.el,
              formatDateObject(
                info.date
              )
            );

          },


        eventDisplay:
          "block",

        displayEventTime:
          false

      }
    );


  calendar.render();

}


/* =====================================================
 * 06. カレンダー操作
 * ===================================================== */

function handleCalendarDateClick(
  info
) {

  if (
    !isCurrentCalendarMonth(
      info.date
    )
  ) {
    return;
  }


  if (isMultiSelectMode) {

    toggleMultiSelectedDate(
      info.dateStr
    );

    return;

  }


  openShiftModal(
    info.dateStr
  );

}


function handleCalendarEventClick(
  info
) {

  info.jsEvent.preventDefault();
  info.jsEvent.stopPropagation();


  const dateString =
    info.event.startStr
      .substring(
        0,
        10
      );


  if (isMultiSelectMode) {

    toggleMultiSelectedDate(
      dateString
    );

    return;

  }


  openShiftModal(
    dateString
  );

}


function handleCalendarMonthChange() {

  if (isMultiSelectMode) {

    cancelMultiSelect();

  }


  updateBulkTargetMonthText();


  window.setTimeout(
    () => {

      loadDisplayedMonth();

    },
    0
  );

}


function isCurrentCalendarMonth(
  date
) {

  if (!calendar) {
    return false;
  }


  const current =
    calendar.getDate();


  return (

    date.getFullYear() ===
      current.getFullYear() &&

    date.getMonth() ===
      current.getMonth()

  );

}


/* =====================================================
 * 07. 月間データ読み込み
 * ===================================================== */

function loadDisplayedMonth() {

  if (
    !calendar ||
    isLoadingMonth
  ) {
    return;
  }


  const current =
    calendar.getDate();


  const year =
    current.getFullYear();


  const month =
    current.getMonth() + 1;


  setMonthLoading(
    true
  );


  google.script.run

    .withSuccessHandler(
      (result) => {

        clearMonthEntries(
          year,
          month
        );


        const entries =
          result &&
          Array.isArray(
            result.entries
          )
            ? result.entries
            : [];


        entries.forEach(
          (entry) => {

            shiftEntries[
              entry.date
            ] =
              normalizeClientEntry(
                entry
              );

          }
        );


        currentMonthSubmitted =
          Boolean(
            result &&
            result.submitted
          );


        refreshCalendarEvents();

        updateProgress(
          currentMonthSubmitted
        );

        updateBulkPreview();

        setMonthLoading(
          false
        );

      }
    )

    .withFailureHandler(
      (error) => {

        setMonthLoading(
          false
        );


        showNotice(
          getErrorMessage(
            error,
            "シフトの読み込みに失敗しました"
          )
        );

      }
    )

    .getMonthlyShiftData(
      year,
      month
    );

}


function clearMonthEntries(
  year,
  month
) {

  Object
    .keys(
      shiftEntries
    )
    .forEach(
      (dateString) => {

        const date =
          parseLocalDate(
            dateString
          );


        if (

          date.getFullYear() ===
            year &&

          date.getMonth() ===
            month - 1

        ) {

          delete shiftEntries[
            dateString
          ];

        }

      }
    );

}


/**
 * サーバーのシフトデータを
 * フロント用へ整形する。
 */
function normalizeClientEntry(
  entry
) {

  return {

    shiftId:
      entry.shiftId || "",

    targetMonth:
      entry.targetMonth || "",

    date:
      entry.date || "",

    weekday:
      entry.weekday || "",

    castId:
      entry.castId || "",

    castName:
      entry.castName || "",

    status:
      entry.status || "undecided",

    startTime:
      entry.startTime || "",

    endTime:
      entry.endTime || "",

    note:
      entry.note || ""

  };

}


function setMonthLoading(
  loading
) {

  isLoadingMonth =
    loading;


  const status =
    document.getElementById(
      "monthStatus"
    );


  if (!status) {
    return;
  }


  if (loading) {

    status.textContent =
      "読込中";


    status.classList.add(
      "loading"
    );


    return;

  }


  status.classList.remove(
    "loading"
  );

}


/* =====================================================
 * 08. 1日入力モーダル
 * ===================================================== */

/**
 * 1日入力を開くフロー。
 */
function openShiftModal(
  dateString
) {

  if (isSaving) {
    return;
  }


  selectedDate =
    dateString;


  const date =
    parseLocalDate(
      dateString
    );


  const existing =
    shiftEntries[
      dateString
    ];


  updateShiftModalDate(
    date
  );


  if (existing) {

    loadExistingShiftToForm(
      existing
    );

  } else {

    loadNewShiftToForm();

  }


  updateStatusButtons();

  updateWorkingFields();

  showShiftModal();

}


/**
 * 日付・曜日表示を更新する。
 */
function updateShiftModalDate(
  date
) {

  const weekdays = [

    "日曜日",
    "月曜日",
    "火曜日",
    "水曜日",
    "木曜日",
    "金曜日",
    "土曜日"

  ];


  document
    .getElementById(
      "modalDateTitle"
    )
    .textContent =
      `${date.getMonth() + 1}月` +
      `${date.getDate()}日`;


  document
    .getElementById(
      "modalWeekday"
    )
    .textContent =
      weekdays[
        date.getDay()
      ];

}


/**
 * 保存済みデータをフォームへ反映する。
 */
function loadExistingShiftToForm(
  existing
) {

  selectedStatus =
    existing.status ||
    "working";


  setManualTimeValue(
    "start",
    normalizeTimeInputValue(
      existing.startTime,
      getDefaultStartTime()
    )
  );


  setEndTimeLastState(

    String(
      existing.endTime || ""
    ).toUpperCase() ===
      "LAST",

    normalizeTimeInputValue(
      existing.endTime,
      getDefaultEndTime()
    )

  );


  document
    .getElementById(
      "shiftNote"
    )
    .value =
      existing.note || "";


  document
    .getElementById(
      "clearDateButton"
    )
    .classList.remove(
      "hidden"
    );

}


/**
 * 新規入力の初期値を設定する。
 */
function loadNewShiftToForm() {

  selectedStatus =
    "working";


  setManualTimeValue(
    "start",
    getDefaultStartTime()
  );


  setEndTimeLastState(
    false,
    getDefaultEndTime()
  );


  document
    .getElementById(
      "shiftNote"
    )
    .value =
      "";


  document
    .getElementById(
      "clearDateButton"
    )
    .classList.add(
      "hidden"
    );

}


/**
 * 1日入力モーダルを表示する。
 */
function showShiftModal() {

  document
    .getElementById(
      "shiftModal"
    )
    .classList.remove(
      "hidden"
    );


  document.body.classList.add(
    "modal-open"
  );

}


function closeShiftModal() {

  if (isSaving) {
    return;
  }


  document
    .getElementById(
      "shiftModal"
    )
    .classList.add(
      "hidden"
    );


  document.body.classList.remove(
    "modal-open"
  );


  selectedDate = "";

}


function handleOverlayClick(
  event
) {

  if (
    event.target.id ===
    "shiftModal"
  ) {

    closeShiftModal();

  }

}


/* =====================================================
 * 09. 勤務区分
 * ===================================================== */

function selectStatus(
  status
) {

  if (
    !isAllowedStatus(
      status
    )
  ) {
    return;
  }


  selectedStatus =
    status;


  updateStatusButtons();

  updateWorkingFields();

}


function updateStatusButtons() {

  const ids = {

    working:
      "statusWorking",

    holiday:
      "statusHoliday",

    undecided:
      "statusUndecided"

  };


  Object
    .keys(
      ids
    )
    .forEach(
      (status) => {

        const button =
          document.getElementById(
            ids[
              status
            ]
          );


        if (!button) {
          return;
        }


        button.classList.toggle(

          "selected",

          selectedStatus ===
            status

        );

      }
    );

}


function updateWorkingFields() {

  const workingFields =
    document.getElementById(
      "workingFields"
    );


  if (!workingFields) {
    return;
  }


  workingFields.classList.toggle(

    "hidden",

    selectedStatus !==
      "working"

  );

}


/* =====================================================
 * 10. 手入力時間・設定
 * ===================================================== */

/**
 * 時間入力欄のID設定を取得する。
 */
function getManualTimeConfig(
  target
) {

  const configs = {

    start: {
      hourId: "startHour",
      minuteId: "startMinute",
      hiddenId: "startTime"
    },

    end: {
      hourId: "endHour",
      minuteId: "endMinute",
      hiddenId: "endTime"
    },

    bulkStart: {
      hourId: "bulkStartHour",
      minuteId: "bulkStartMinute",
      hiddenId: "bulkStartTime"
    },

    bulkEnd: {
      hourId: "bulkEndHour",
      minuteId: "bulkEndMinute",
      hiddenId: "bulkEndTime"
    }

  };


  return configs[
    target
  ] || null;

}


/* =====================================================
 * 11. 手入力時間・全体初期化
 * ===================================================== */

function initializeManualTimeInputs() {

  [
    "start",
    "end",
    "bulkStart",
    "bulkEnd"
  ].forEach(
    (target) => {

      initializeManualTimeField(
        target
      );

    }
  );


  setManualTimeValue(
    "start",
    getDefaultStartTime()
  );


  setManualTimeValue(
    "end",
    getDefaultEndTime()
  );


  setManualTimeValue(
    "bulkStart",
    getDefaultStartTime()
  );


  setManualTimeValue(
    "bulkEnd",
    getDefaultEndTime()
  );

}


/* =====================================================
 * 12. 手入力時間・イベント登録
 * ===================================================== */

function initializeManualTimeField(
  target
) {

  const config =
    getManualTimeConfig(
      target
    );


  if (!config) {
    return;
  }


  const hourInput =
    document.getElementById(
      config.hourId
    );


  const minuteInput =
    document.getElementById(
      config.minuteId
    );


  if (
    !hourInput ||
    !minuteInput
  ) {
    return;
  }


  /* ---------- 時：フォーカス ---------- */

  hourInput.addEventListener(
    "focus",
    () => {

      selectTimeInputText(
        hourInput
      );

    }
  );


  hourInput.addEventListener(
    "click",
    () => {

      selectTimeInputText(
        hourInput
      );

    }
  );


  /* ---------- 時：入力 ---------- */

  hourInput.addEventListener(
    "input",
    () => {

      handleHourInput(
        target
      );

    }
  );


  /* ---------- 時：フォーカス解除 ---------- */

  hourInput.addEventListener(
    "blur",
    () => {

      normalizeManualTimePart(
        hourInput,
        23
      );


      syncManualTimeValue(
        target
      );

    }
  );


  /* ---------- 分：フォーカス ---------- */

  minuteInput.addEventListener(
    "focus",
    () => {

      selectTimeInputText(
        minuteInput
      );

    }
  );


  minuteInput.addEventListener(
    "click",
    () => {

      selectTimeInputText(
        minuteInput
      );

    }
  );


  /* ---------- 分：入力 ---------- */

  minuteInput.addEventListener(
    "input",
    () => {

      handleMinuteInput(
        target
      );

    }
  );


  /* ---------- 分：フォーカス解除 ---------- */

  minuteInput.addEventListener(
    "blur",
    () => {

      normalizeManualTimePart(
        minuteInput,
        59
      );


      syncManualTimeValue(
        target
      );

    }
  );


  /* ---------- 分：Backspace ---------- */

  minuteInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Backspace" &&
        minuteInput.value === ""
      ) {

        event.preventDefault();


        hourInput.focus();


        selectTimeInputText(
          hourInput
        );

      }

    }
  );

}


/* =====================================================
 * 13. 手入力時間・時入力
 * ===================================================== */

function handleHourInput(
  target
) {

  const config =
    getManualTimeConfig(
      target
    );


  if (!config) {
    return;
  }


  const hourInput =
    document.getElementById(
      config.hourId
    );


  const minuteInput =
    document.getElementById(
      config.minuteId
    );


  if (
    !hourInput ||
    !minuteInput
  ) {
    return;
  }


  hourInput.value =
    sanitizeManualTimeDigits(
      hourInput.value
    );


  syncManualTimeValue(
    target
  );


  if (
    hourInput.value.length !==
    2
  ) {
    return;
  }


  const hour =
    Number(
      hourInput.value
    );


  if (
    !Number.isInteger(hour) ||
    hour < 0 ||
    hour > 23
  ) {
    return;
  }


  moveToMinuteInput(
    minuteInput
  );

}


/* =====================================================
 * 14. 手入力時間・分入力
 * ===================================================== */

function handleMinuteInput(
  target
) {

  const config =
    getManualTimeConfig(
      target
    );


  if (!config) {
    return;
  }


  const minuteInput =
    document.getElementById(
      config.minuteId
    );


  if (!minuteInput) {
    return;
  }


  minuteInput.value =
    sanitizeManualTimeDigits(
      minuteInput.value
    );


  syncManualTimeValue(
    target
  );


  /*
   * 2桁入力されるまでは
   * 次へ進まない。
   */
  if (
    minuteInput.value.length !==
    2
  ) {
    return;
  }


  const minute =
    Number(
      minuteInput.value
    );


  if (
    !Number.isInteger(minute) ||
    minute < 0 ||
    minute > 59
  ) {
    return;
  }


  /*
   * 1日入力
   *
   * 出勤・分
   * ↓
   * 退勤・時
   */
  if (
    target === "start"
  ) {

    moveToNextTimeInput(
      "endHour"
    );

    return;

  }


  /*
   * 一括入力
   *
   * 出勤・分
   * ↓
   * 退勤・時
   */
  if (
    target === "bulkStart"
  ) {

    moveToNextTimeInput(
      "bulkEndHour"
    );

  }

}


/* =====================================================
 * 15. 手入力時間・フォーカス制御
 * ===================================================== */

function selectTimeInputText(
  input
) {

  if (!input) {
    return;
  }


  try {

    input.select();

  } catch (error) {

    try {

      input.setSelectionRange(
        0,
        input.value.length
      );

    } catch (ignore) {
      // 何もしない
    }

  }

}


/**
 * 時入力後、
 * 分入力へ移動する。
 */
function moveToMinuteInput(
  minuteInput
) {

  if (
    !minuteInput ||
    minuteInput.disabled
  ) {
    return;
  }


  requestAnimationFrame(
    () => {

      minuteInput.focus();


      requestAnimationFrame(
        () => {

          selectTimeInputText(
            minuteInput
          );

        }
      );

    }
  );

}


/**
 * 次の時間入力欄へ移動する。
 */
function moveToNextTimeInput(
  elementId
) {

  const input =
    document.getElementById(
      elementId
    );


  if (
    !input ||
    input.disabled
  ) {
    return;
  }


  requestAnimationFrame(
    () => {

      input.focus();


      requestAnimationFrame(
        () => {

          selectTimeInputText(
            input
          );

        }
      );

    }
  );

}


/* =====================================================
 * 16. 手入力時間・数字整形
 * ===================================================== */

function sanitizeManualTimeDigits(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /\D/g,
      ""
    )
    .slice(
      0,
      2
    );

}


function normalizeManualTimePart(
  input,
  max
) {

  if (
    !input ||
    input.value === ""
  ) {
    return;
  }


  const number =
    Number(
      input.value
    );


  if (
    !Number.isInteger(number) ||
    number < 0 ||
    number > max
  ) {

    input.value = "";

    return;

  }


  input.value =
    String(number)
      .padStart(
        2,
        "0"
      );

}


/* =====================================================
 * 17. 手入力時間・hidden同期
 * ===================================================== */

function syncManualTimeValue(
  target
) {

  const config =
    getManualTimeConfig(
      target
    );


  if (!config) {
    return;
  }


  const hourInput =
    document.getElementById(
      config.hourId
    );


  const minuteInput =
    document.getElementById(
      config.minuteId
    );


  const hiddenInput =
    document.getElementById(
      config.hiddenId
    );


  if (
    !hourInput ||
    !minuteInput ||
    !hiddenInput
  ) {
    return;
  }


  const hour =
    hourInput.value;


  const minute =
    minuteInput.value;


  if (
    hour.length !== 2 ||
    minute.length !== 2
  ) {

    hiddenInput.value = "";

    return;

  }


  const hourNumber =
    Number(hour);


  const minuteNumber =
    Number(minute);


  if (
    hourNumber < 0 ||
    hourNumber > 23 ||
    minuteNumber < 0 ||
    minuteNumber > 59
  ) {

    hiddenInput.value = "";

    return;

  }


  hiddenInput.value =
    `${hour}:${minute}`;

}


/* =====================================================
 * 18. 手入力時間・画面反映
 * ===================================================== */

function setManualTimeValue(
  target,
  value
) {

  const config =
    getManualTimeConfig(
      target
    );


  if (!config) {
    return;
  }


  const normalized =
    normalizeTimeInputValue(
      value,
      ""
    );


  if (!normalized) {
    return;
  }


  const [
    hour,
    minute
  ] =
    normalized.split(":");


  const hourInput =
    document.getElementById(
      config.hourId
    );


  const minuteInput =
    document.getElementById(
      config.minuteId
    );


  const hiddenInput =
    document.getElementById(
      config.hiddenId
    );


  if (hourInput) {

    hourInput.value =
      hour;

  }


  if (minuteInput) {

    minuteInput.value =
      minute;

  }


  if (hiddenInput) {

    hiddenInput.value =
      normalized;

  }

}


/* =====================================================
 * 19. 時間デフォルト・整形
 * ===================================================== */

/**
 * 現在キャストのデフォルト出勤時間。
 *
 * 優先順位
 * 1. CAST
 * 2. SETTINGS
 */
function getDefaultStartTime() {

  if (
    currentCastDefaults &&
    currentCastDefaults.defaultStartTime
  ) {

    return (
      currentCastDefaults.defaultStartTime
    );

  }


  return getSettingsDefaultStartTime();

}


/**
 * 現在キャストのデフォルト退勤時間。
 *
 * 優先順位
 * 1. CAST
 * 2. SETTINGS
 */
function getDefaultEndTime() {

  if (
    currentCastDefaults &&
    currentCastDefaults.defaultEndTime
  ) {

    return (
      currentCastDefaults.defaultEndTime
    );

  }


  return getSettingsDefaultEndTime();

}


/**
 * SETTINGS共通デフォルト出勤時間。
 */
function getSettingsDefaultStartTime() {

  if (!shiftSettings) {
    return "20:00";
  }


  return (
    shiftSettings.defaultStartHour +
    ":" +
    shiftSettings.defaultStartMinute
  );

}


/**
 * SETTINGS共通デフォルト退勤時間。
 */
function getSettingsDefaultEndTime() {

  if (!shiftSettings) {
    return "01:00";
  }


  return (
    shiftSettings.defaultEndHour +
    ":" +
    shiftSettings.defaultEndMinute
  );

}


/**
 * 時間をHH:mmへ整形する。
 *
 * 22:30 → 22:30
 * 0:15  → 00:15
 */
function normalizeTimeInputValue(
  value,
  fallbackValue
) {

  const text =
    String(
      value || ""
    ).trim();


  const match =
    text.match(
      /^(\d{1,2}):(\d{1,2})$/
    );


  if (!match) {
    return fallbackValue;
  }


  const hour =
    Number(
      match[1]
    );


  const minute =
    Number(
      match[2]
    );


  if (
    !Number.isInteger(hour) ||
    !Number.isInteger(minute) ||
    hour < 0 ||
    hour > 23 ||
    minute < 0 ||
    minute > 59
  ) {

    return fallbackValue;

  }


  return (
    String(hour)
      .padStart(
        2,
        "0"
      ) +
    ":" +
    String(minute)
      .padStart(
        2,
        "0"
      )
  );

}

 * 25. 一括登録件数
 * ===================================================== */

function updateBulkPreview() {

  let count = 0;


  if (
    bulkMode ===
    "selectedDates"
  ) {

    count =
      multiSelectedDates.length;

  }


  if (
    bulkMode ===
    "weekdays"
  ) {

    count =
      getWeekdayTargetDates()
        .length;

  }


  const preview =
    document.getElementById(
      "bulkPreviewCount"
    );


  if (preview) {

    preview.textContent =
      `${count}日`;

  }


  updateMultiSelectDisplay();

  updateBulkSaveButtonText();

function getWeekdayTargetDates() {

  if (

    !calendar ||

    bulkWeekdays.length ===
      0

  ) {
    return [];
  }


  const current =
    calendar.getDate();


  const year =
    current.getFullYear();


  const month =
    current.getMonth();


  const lastDay =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const dates = [];


  for (
    let day = 1;
    day <= lastDay;
    day += 1
  ) {

    const date =
      new Date(
        year,
        month,
        day
      );


    if (
      bulkWeekdays.includes(
        date.getDay()
      )
    ) {

      dates.push(
        formatDateObject(
          date
        )
      );

    }

  }


  return dates;

}

/* =====================================================
 * 26. 1日保存
 * ===================================================== */

function saveSelectedDate() {

  if (isSaving) {
    return;
  }


  if (!selectedDate) {

    showNotice(
      "日付が選択されていません"
    );

    return;

  }


  const entry =
    createShiftEntryFromForm({

      date:
        selectedDate,

      status:
        selectedStatus,

      startElementId:
        "startTime",

      endElementId:
        "endTime",

      noteElementId:
        "shiftNote"

    });


  if (!entry) {
    return;
  }


  setSingleSavingState(
    true
  );


  google.script.run

    .withSuccessHandler(
      (result) => {

        const savedEntry =
          result &&
          result.entry

            ? normalizeClientEntry(
                result.entry
              )

            : entry;


        shiftEntries[
          selectedDate
        ] =
          savedEntry;


        currentMonthSubmitted =
          false;


        refreshCalendarEvents();

        updateProgress(
          false
        );


        setSingleSavingState(
          false
        );


        closeShiftModal();


        showNotice(
          "シフトを保存しました"
        );

      }
    )

    .withFailureHandler(
      (error) => {

        setSingleSavingState(
          false
        );


        showNotice(
          getErrorMessage(
            error,
            "シフトの保存に失敗しました"
          )
        );

      }
    )

    .saveShiftEntry(
      entry
    );

}


function clearSelectedDate() {

  if (

    isSaving ||

    !selectedDate ||

    !shiftEntries[
      selectedDate
    ]

  ) {
    return;
  }


  const targetDate =
    selectedDate;


  setSingleSavingState(
    true
  );


  google.script.run

    .withSuccessHandler(
      () => {

        delete shiftEntries[
          targetDate
        ];


        currentMonthSubmitted =
          false;


        refreshCalendarEvents();

        updateProgress(
          false
        );


        setSingleSavingState(
          false
        );


        closeShiftModal();


        showNotice(
          "入力を削除しました"
        );

      }
    )

    .withFailureHandler(
      (error) => {

        setSingleSavingState(
          false
        );


        showNotice(
          getErrorMessage(
            error,
            "入力の削除に失敗しました"
          )
        );

      }
    )

    .deleteShiftEntry(
      targetDate
    );

}


function setSingleSavingState(
  saving
) {

  isSaving =
    saving;


  const saveButton =
    document.getElementById(
      "saveSelectedDateButton"
    );


  const clearButton =
    document.getElementById(
      "clearDateButton"
    );


  if (saveButton) {

    saveButton.disabled =
      saving;


    saveButton.textContent =
      saving

        ? "保存しています..."

        : "この日の内容を保存";

  }


  if (clearButton) {

    clearButton.disabled =
      saving;

  }

}


/* =====================================================
 * 27. 一括保存
 * ===================================================== */

function saveBulkInput() {

  if (
    isBulkSaving ||
    isSaving
  ) {
    return;
  }


  if (
    bulkMode ===
    "selectedDates"
  ) {

    saveMultiSelectedDates();

    return;

  }


  saveSelectedWeekdays();

}


function saveMultiSelectedDates() {

  if (
    multiSelectedDates.length ===
    0
  ) {

    showNotice(
      "日付を1日以上選択してください"
    );

    return;

  }


  const commonData =
    createBulkCommonData();


  if (!commonData) {
    return;
  }


  const payload = {

    dates:
      [
        ...multiSelectedDates
      ],

    status:
      commonData.status,

    startTime:
      commonData.startTime,

    endTime:
      commonData.endTime,

    note:
      commonData.note,

    overwrite:
      commonData.overwrite

  };


  setBulkSavingState(
    true
  );


  google.script.run

    .withSuccessHandler(
      (result) => {

        handleBulkSaveSuccess(
          result
        );

      }
    )

    .withFailureHandler(
      (error) => {

        setBulkSavingState(
          false
        );


        showNotice(
          getErrorMessage(
            error,
            "一括登録に失敗しました"
          )
        );

      }
    )

    .saveMultiShifts(
      payload
    );

}


function saveSelectedWeekdays() {

  if (
    bulkWeekdays.length ===
    0
  ) {

    showNotice(
      "曜日を1つ以上選択してください"
    );

    return;

  }


  if (!calendar) {
    return;
  }


  const commonData =
    createBulkCommonData();


  if (!commonData) {
    return;
  }


  const current =
    calendar.getDate();


  const payload = {

    targetMonth:
      `${current.getFullYear()}-` +
      `${String(
        current.getMonth() + 1
      ).padStart(
        2,
        "0"
      )}`,

    weekdays:
      [
        ...bulkWeekdays
      ],

    status:
      commonData.status,

    startTime:
      commonData.startTime,

    endTime:
      commonData.endTime,

    note:
      commonData.note,

    overwrite:
      commonData.overwrite

  };


  setBulkSavingState(
    true
  );


  google.script.run

    .withSuccessHandler(
      (result) => {

        handleBulkSaveSuccess(
          result
        );

      }
    )

    .withFailureHandler(
      (error) => {

        setBulkSavingState(
          false
        );


        showNotice(
          getErrorMessage(
            error,
            "曜日一括登録に失敗しました"
          )
        );

      }
    )

    .saveBulkShifts(
      payload
    );

}


/**
 * 一括保存成功後の共通処理。
 */
function handleBulkSaveSuccess(
  result
) {

  setBulkSavingState(
    false
  );


  const savedEntries =
    result &&
    Array.isArray(
      result.entries
    )

      ? result.entries

      : [];


  savedEntries.forEach(
    (entry) => {

      const normalized =
        normalizeClientEntry(
          entry
        );


      shiftEntries[
        normalized.date
      ] =
        normalized;

    }
  );


  currentMonthSubmitted =
    false;


  closeBulkModal();

  cancelMultiSelect();

  refreshCalendarEvents();

  updateProgress(
    false
  );


  if (
    savedEntries.length ===
    0
  ) {

    loadDisplayedMonth();

  }


  const savedCount =
    result &&
    Number.isFinite(
      Number(
        result.savedCount
      )
    )

      ? Number(
          result.savedCount
        )

      : savedEntries.length;


  const skippedCount =
    result &&
    Number.isFinite(
      Number(
        result.skippedCount
      )
    )

      ? Number(
          result.skippedCount
        )

      : 0;


  showBulkSaveResult(
    savedCount,
    skippedCount
  );

}


/**
 * 一括フォーム共通データを生成する。
 */
function createBulkCommonData() {

  const status =
    bulkStatus;


  const startTime =
    status ===
      "working"

      ? document
          .getElementById(
            "bulkStartTime"
          )
          .value

      : "";


  const endTime =
    status ===
      "working"

      ? (
          isBulkEndTimeLast

            ? "LAST"

            : document
                .getElementById(
                  "bulkEndTime"
                )
                .value
        )

      : "";


  if (

    status ===
      "working" &&

    (
      !startTime ||
      !endTime
    )

  ) {

    showNotice(
      "出勤時間と退勤時間を入力してください"
    );

    return null;

  }


  return {

    status:
      status,

    startTime:
      startTime,

    endTime:
      endTime,

    note:
      document
        .getElementById(
          "bulkShiftNote"
        )
        .value
        .trim(),

    overwrite:
      document
        .getElementById(
          "bulkOverwrite"
        )
        .checked

  };

}


function setBulkSavingState(
  saving
) {

  isBulkSaving =
    saving;


  const button =
    document.getElementById(
      "saveBulkButton"
    );


  const closeButton =
    document.querySelector(
      "#bulkModal .modal-close"
    );


  if (button) {

    button.disabled =
      saving;

  }


  if (closeButton) {

    closeButton.disabled =
      saving;

  }


  updateBulkSaveButtonText();

}


function showBulkSaveResult(
  savedCount,
  skippedCount
) {

  if (
    skippedCount > 0
  ) {

    showNotice(
      `${savedCount}日登録・` +
      `${skippedCount}日スキップしました`
    );


    return;

  }


  showNotice(
    `${savedCount}日分を一括登録しました`
  );

}


/* =====================================================
 * 28. 入力データ生成
 * ===================================================== */

function createShiftEntryFromForm(
  options
) {

  const entry = {

    date:
      options.date,

    status:
      options.status,

    startTime:
      "",

    endTime:
      "",

    note:
      document
        .getElementById(
          options.noteElementId
        )
        .value
        .trim()

  };


  if (
    options.status ===
    "working"
  ) {

    entry.startTime =
      document
        .getElementById(
          options.startElementId
        )
        .value;


    const useLast =
      options.endElementId ===
        "endTime"

        ? isEndTimeLast

        : isBulkEndTimeLast;


    entry.endTime =
      useLast

        ? "LAST"

        : document
            .getElementById(
              options.endElementId
            )
            .value;


    if (

      !entry.startTime ||

      !entry.endTime

    ) {

      showNotice(
        "出勤時間と退勤時間を入力してください"
      );


      return null;

    }

  }


  return entry;

}


function isAllowedStatus(
  status
) {

  return [

    "working",
    "holiday",
    "undecided"

  ].includes(
    status
  );

}


/* =====================================================
 * 29. シフトイベント表示
 * ===================================================== */

function refreshCalendarEvents() {

  if (!calendar) {
    return;
  }


  calendar.removeAllEvents();


  Object
    .values(
      shiftEntries
    )
    .forEach(
      (entry) => {

        calendar.addEvent(
          createCalendarEvent(
            entry
          )
        );

      }
    );


  window.setTimeout(
    () => {

      refreshMultiSelectedDays();

    },
    0
  );

}


function createCalendarEvent(
  entry
) {

  let title = "";
  let className = "";


  if (
    entry.status ===
    "working"
  ) {

    title =
      `${entry.startTime}〜` +
      `${entry.endTime}`;


    className =
      "shift-event-working";

  }


  if (
    entry.status ===
    "holiday"
  ) {

    title =
      "休み";


    className =
      "shift-event-holiday";

  }


  if (
    entry.status ===
    "undecided"
  ) {

    title =
      "未定";


    className =
      "shift-event-undecided";

  }


  return {

    id:
      entry.date,

    title:
      title,

    start:
      entry.date,

    allDay:
      true,

    classNames: [
      className
    ]

  };

}


/* =====================================================
 * 30. 入力進捗
 * ===================================================== */

function updateProgress(
  submitted
) {

  if (!calendar) {
    return;
  }


  const current =
    calendar.getDate();


  const year =
    current.getFullYear();


  const month =
    current.getMonth();


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  let completedDays = 0;


  Object
    .keys(
      shiftEntries
    )
    .forEach(
      (dateString) => {

        const date =
          parseLocalDate(
            dateString
          );


        if (

          date.getFullYear() ===
            year &&

          date.getMonth() ===
            month

        ) {

          completedDays += 1;

        }

      }
    );


  const percent =
    Math.round(
      completedDays /
      daysInMonth *
      100
    );


  document
    .getElementById(
      "progressPercent"
    )
    .textContent =
      `${percent}%`;


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      `${percent}%`;


  document
    .getElementById(
      "progressMessage"
    )
    .textContent =

      completedDays ===
        0

        ? "日付を選択して入力してください"

        : `${completedDays}日分入力済み`;


  const status =
    document.getElementById(
      "monthStatus"
    );


  status.textContent =
    submitted

      ? "提出済み"

      : "未提出";


  updateSubmitButton(
    completedDays,
    submitted
  );

}


function updateSubmitButton(
  completedDays,
  submitted
) {

  const button =
    document.getElementById(
      "submitMonthButton"
    );


  if (!button) {
    return;
  }


  button.disabled =
    completedDays ===
      0;


  button.textContent =
    submitted

      ? "この内容で再提出する"

      : "この内容で提出する";

}


/* =====================================================
 * 31. 月間提出
 * ===================================================== */

function submitMonth() {

  if (

    !calendar ||

    isSaving ||

    isBulkSaving

  ) {
    return;
  }


  const current =
    calendar.getDate();


  const year =
    current.getFullYear();


  const month =
    current.getMonth();


  const entries =
    Object
      .values(
        shiftEntries
      )
      .filter(
        (entry) => {

          const date =
            parseLocalDate(
              entry.date
            );


          return (

            date.getFullYear() ===
              year &&

            date.getMonth() ===
              month

          );

        }
      );


  if (
    entries.length ===
    0
  ) {

    showNotice(
      "シフトを1日以上入力してください"
    );

    return;

  }


  const button =
    document.getElementById(
      "submitMonthButton"
    );


  button.disabled =
    true;


  button.textContent =
    "提出しています...";


  google.script.run

    .withSuccessHandler(
      (result) => {

        currentMonthSubmitted =
          true;


        updateProgress(
          true
        );


        const entryCount =
          result &&
          result.entryCount

            ? result.entryCount

            : entries.length;


        showNotice(
          `${entryCount}日分のシフトを提出しました`
        );

      }
    )

    .withFailureHandler(
      (error) => {

        updateProgress(
          currentMonthSubmitted
        );


        showNotice(
          getErrorMessage(
            error,
            "月間シフトの提出に失敗しました"
          )
        );

      }
    )

    .submitMonthlyShift(
      year,
      month + 1
    );

}


/* =====================================================
 * 32. 日付操作
 * ===================================================== */

function parseLocalDate(
  dateString
) {

  const parts =
    dateString
      .split(
        "-"
      )
      .map(
        Number
      );


  return new Date(

    parts[0],

    parts[1] - 1,

    parts[2]

  );

}


function formatDateObject(
  date
) {

  return (

    String(
      date.getFullYear()
    ) +

    "-" +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +

    "-" +

    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )

  );

}


/* =====================================================
 * 33. エラー・通知
 * ===================================================== */

function getErrorMessage(
  error,
  fallbackMessage
) {

  if (!error) {
    return fallbackMessage;
  }


  if (error.message) {

    return String(
      error.message
    ).replace(
      /^Exception:\s*/,
      ""
    );

  }


  return fallbackMessage;

}


function showNotice(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  if (!toast) {
    return;
  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  if (toastTimer) {

    clearTimeout(
      toastTimer
    );

  }


  toastTimer =
    window.setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}


/* =====================================================
 * END
 * ===================================================== */

</script>
